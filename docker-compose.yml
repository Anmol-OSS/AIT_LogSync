# LogSync ULPF - the pipeline as separate services around Kafka.
#
#   docker compose up --build                  # ingest, Kafka, worker, API + UI
#   docker compose --profile llm up --build    # plus a local Ollama for parser drafting
#
# UI and API: http://localhost:8000   Syslog in: udp/tcp 5514
# Nothing here needs internet access at runtime (air-gap: see README).
services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  ingest:
    build: .
    command: ["ingest", "--host", "0.0.0.0", "--syslog-port", "5514"]
    environment:
      LOGSYNC_KAFKA: kafka:9092
    ports:
      - "5514:5514/tcp"
      - "5514:5514/udp"
    depends_on:
      kafka: {condition: service_healthy}

  worker:
    build: .
    command: ["worker"]
    environment:
      LOGSYNC_KAFKA: kafka:9092
      # LOGSYNC_FORWARD: udp://your-siem:514     # push normalized events to a SIEM
      # LOGSYNC_FORWARD_FORMAT: json             # or cef
    volumes:
      - data:/data
    depends_on:
      kafka: {condition: service_healthy}
    # One worker writes one evidence store (archive + Merkle log). Scaling out means
    # one store per Kafka partition group; the prototype runs a single writer.
    deploy:
      replicas: 1

  api:
    build: .
    command: ["api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      LOGSYNC_KAFKA: kafka:9092
      LOGSYNC_OLLAMA_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    depends_on:
      kafka: {condition: service_healthy}

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama:/root/.ollama     # pre-load llama3:8b here for air-gapped use

volumes:
  data:
  ollama:
