# Check Point Log Exporter - CEF over syslog.
id: checkpoint-cef
version: 1.0.2
vendor: Check Point
product: VPN-1 & FireWall-1
family: Check Point
source_name: checkpoint_cef
priority: 10
fingerprint: '^<\d{1,3}>\w{3} [ \d]\d [\d:]{8} \S+ CEF:0\|Check Point\|'
format: cef
header: '<%{INT:pri}>%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:host} '
map:
  time:                          {from: rt, transforms: [epoch_ms, tz]}
  device.hostname:               host
  src_endpoint.ip:               {from: src, transforms: [ip]}
  src_endpoint.port:             {from: spt, transforms: [int]}
  dst_endpoint.ip:               {from: dst, transforms: [ip]}
  dst_endpoint.port:             {from: dpt, transforms: [int]}
  connection_info.protocol_name: {from: proto, transforms: [lower]}
  disposition:                   {from: act, transforms: [{lookup: {Accept: Allowed, Drop: Blocked, Reject: Blocked}}]}
  severity_id:                   {from: cef.severity, transforms: [{lookup: {Low: 1, Medium: 3, High: 4, Critical: 5, Unknown: 0}}]}
constants:
  class_uid: 4001
  class_name: Network Activity
  category_uid: 4
  metadata.product.vendor_name: Check Point
  metadata.product.name: VPN-1 & FireWall-1
