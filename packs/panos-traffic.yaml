# Palo Alto Networks PAN-OS - CSV TRAFFIC log over syslog.
id: panos-traffic
version: 1.2.0
vendor: Palo Alto Networks
product: PAN-OS
family: PAN-OS
source_name: panos
priority: 10
fingerprint: '^<\d{1,3}>\w{3} [ \d]\d [\d:]{8} \S+ \d+,\d{4}/\d\d/\d\d [\d:]{8},\d+,TRAFFIC,'
format: csv
header: '<%{INT:pri}>%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:host} '
columns: [future_use_1, receive_time, serial, type, subtype, future_use_2, generated_time,
          src_ip, dst_ip, nat_src_ip, nat_dst_ip, rule, src_user, dst_user, application,
          vsys, src_zone, dst_zone, inbound_if, outbound_if, log_action, future_use_3,
          session_id, repeat_count, src_port, dst_port, nat_src_port, nat_dst_port, flags,
          protocol, action, bytes, bytes_sent, bytes_received, packets, start_time,
          elapsed, category, future_use_4, sequence]
exact_columns: true            # a firmware that adds columns must not shift values silently
validate:
  receive_time: '\d{4}/\d\d/\d\d \d\d:\d\d:\d\d'
  generated_time: '\d{4}/\d\d/\d\d \d\d:\d\d:\d\d'
  type: 'TRAFFIC'
  session_id: '%{INT}'
  repeat_count: '%{INT}'
  flags: '%{BASE16NUM}'
  bytes: '%{INT}'
  packets: '%{INT}'
  elapsed: '%{INT}'
  sequence: '%{INT}'
map:
  time:                          {from: generated_time, transforms: [{strptime: "%Y/%m/%d %H:%M:%S"}, tz]}
  device.hostname:               host
  src_endpoint.ip:               {from: src_ip, transforms: [ip]}
  src_endpoint.port:             {from: src_port, transforms: [int]}
  dst_endpoint.ip:               {from: dst_ip, transforms: [ip]}
  dst_endpoint.port:             {from: dst_port, transforms: [int]}
  connection_info.protocol_name: {from: protocol, transforms: [lower]}
  disposition:                   {from: action, transforms: [{lookup: {allow: Allowed, deny: Blocked, drop: Blocked, reset-both: Blocked}}]}
  severity_id:                   {from: action, transforms: [{lookup: {allow: 1, "*": 3}}]}
  traffic.bytes_out:             {from: bytes_sent, transforms: [int]}
  traffic.bytes_in:              {from: bytes_received, transforms: [int]}
constants:
  class_uid: 4001
  class_name: Network Activity
  category_uid: 4
  metadata.product.vendor_name: Palo Alto Networks
  metadata.product.name: PAN-OS
