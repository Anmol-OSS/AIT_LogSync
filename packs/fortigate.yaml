# Fortinet FortiGate - key=value traffic logs, <PRI>-only syslog header.
id: fortigate
version: 1.4.0
vendor: Fortinet
product: FortiGate
family: FortiGate
source_name: fortigate
priority: 10
fingerprint: '^<\d{1,3}>date=\S+ time=\S+ devname='
format: kv
header: '<%{INT:pri}>'
required: [date, time, devname, eventtime, srcip, srcport, dstip, dstport, proto, action,
           sentbyte, rcvdbyte, sentpkt, rcvdpkt]
validate:
  sentpkt: '%{INT}'
  rcvdpkt: '%{INT}'
map:
  time:                          {from: eventtime, transforms: [epoch_ns, tz]}
  device.hostname:               devname
  src_endpoint.ip:               {from: srcip, transforms: [ip]}
  src_endpoint.port:             {from: srcport, transforms: [int]}
  dst_endpoint.ip:               {from: dstip, transforms: [ip]}
  dst_endpoint.port:             {from: dstport, transforms: [int]}
  connection_info.protocol_name: {from: proto, transforms: [iana_proto]}
  disposition:                   {from: action, transforms: [{lookup: {accept: Allowed, close: Allowed, deny: Blocked}}]}
  severity_id:                   {from: level, transforms: [{lookup: {information: 1, notice: 1, warning: 3, error: 4, critical: 5}}]}
  traffic.bytes_out:             {from: sentbyte, transforms: [int]}
  traffic.bytes_in:              {from: rcvdbyte, transforms: [int]}
  metadata.event_code:           logid
constants:
  class_uid: 4001
  class_name: Network Activity
  category_uid: 4
  metadata.product.vendor_name: Fortinet
  metadata.product.name: FortiGate
